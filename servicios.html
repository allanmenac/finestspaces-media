<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Servicios · VISIONARQ</title>
  <meta name="description" content="Arquitectura, construcción, diseño de interiores y consultoría. Los cuatro servicios de VISIONARQ en San José, Costa Rica." />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main>
    <!-- SERVICIOS — slider tipo Inicio: a la izquierda la foto del servicio, a la
         derecha el texto del servicio; al centro una tarjeta cuadrada con borde
         y el logo VA estampado/animado. La cortina sube/baja al hacer scroll y
         el tono gris cambia en cada servicio (escala de grises). 4 servicios. -->
    <section class="svc-slider" id="svc-slider">
      <div class="svc-stage" id="svc-stage">

        <!-- Tarjeta central (las diapositivas se inyectan antes que ella) -->
        <div class="svc-cardx" id="svc-cardx" aria-hidden="true">
          <span class="svc-cardx__wipe" id="svc-cardx-wipe"></span>
          <span class="svc-cardx__logo" id="svc-cardx-logo">
            <svg class="mark mark--split" viewBox="0 0 803 311" fill="none">
              <path class="va-v" fill="currentColor" fill-rule="evenodd" d="M216.94,283.27C210.1,274.04 161.42,209.01 108.75,138.75C56.09,68.48 13,10.75 13,10.46C13,10.17 18.06,10.06 24.25,10.22L35.5,10.5L115,116.44C158.73,174.7 194.95,222.5 195.5,222.65C196.05,222.81 232.38,175.03 276.24,116.47L355.98,10L401.1,10C436.79,10 446.11,10.26 445.71,11.25C445.29,12.29 232.19,296.89 230.06,299.27C229.68,299.69 223.78,292.49 216.94,283.27Z"/>
              <path class="va-a" fill="currentColor" fill-rule="evenodd" d="M267.65,297.17C268.67,295.6 317.42,230.34 375.99,152.15L482.48,9.98L527.96,10.24L573.45,10.5L579.11,18C596.35,40.83 788.71,297.7 789.35,298.75C789.95,299.72 787.59,300 778.78,300L767.44,300L664.57,162.78C569.53,36.02 561.6,25.72 560.33,27.53C559.58,28.62 513.41,90.25 457.72,164.5L356.48,299.5L311.14,299.76L265.79,300.02L267.65,297.17Z"/>
            </svg>
          </span>
        </div>

      </div>
    </section>
  </main>

  <script src="assets/js/vendor/gsap.min.js"></script>
  <script src="assets/js/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/js/vendor/Flip.min.js"></script>
  <script src="assets/js/vendor/SplitText.min.js"></script>
  <script src="assets/js/vendor/lenis.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
  /* ── SERVICIOS — slider con cortina (clon del mecanismo del Inicio) ──
     Izquierda: foto del servicio. Derecha: texto (H1 + bullets + ver servicio).
     Centro: tarjeta cuadrada con borde + logo VA estampado que se DIBUJA en
     cada cambio. El tono gris cambia por servicio (escala de grises). */
  (function () {
    var SERVICES = [
      { eyebrow: "Servicio 01", title: "Arquitectura", color: "#1E1E1E",
        img: "assets/img/photos/servicio-arquitectura.jpg", link: "servicio.html?s=arquitectura",
        bullets: ["Diseño arquitectónico y anteproyectos a la medida",
                  "Planos constructivos, detalles y especificaciones técnicas",
                  "Modelado 3D, renders y visualización fotorrealista",
                  "Estudio de terreno, asoleamiento y normativa"] },
      { eyebrow: "Servicio 02", title: "Construcción", color: "#333333",
        img: "assets/img/photos/servicio-construccion.jpg", link: "servicio.html?s=construccion",
        bullets: ["Construcción llave en mano con un solo responsable",
                  "Remodelaciones, ampliaciones y obra nueva",
                  "Dirección y supervisión de obra, control de tiempos",
                  "Control de calidad, presupuesto y acabados"] },
      { eyebrow: "Servicio 03", title: "Diseño de interiores", color: "#262626",
        img: "assets/img/photos/servicio-interiores.jpg", link: "servicio.html?s=interiores",
        bullets: ["Concepto, paleta de materiales y atmósfera",
                  "Selección de mobiliario, luminarias y textiles",
                  "Carpintería y piezas a medida",
                  "Styling, ambientación y entrega final"] },
      { eyebrow: "Servicio 04", title: "Consultoría", color: "#444444",
        img: "assets/img/photos/servicio-consultoria.jpg", link: "servicio.html?s=consultoria",
        bullets: ["Planes maestros y estudios de factibilidad",
                  "Permisos, trámites municipales y conformidad",
                  "Optimización de presupuesto y valor del proyecto",
                  "Peritajes, avalúos y segundas opiniones"] },
    ];

    var slider = document.getElementById("svc-slider");
    var stage  = document.getElementById("svc-stage");
    var card   = document.getElementById("svc-cardx");
    var wipe   = document.getElementById("svc-cardx-wipe");
    var logo   = document.getElementById("svc-cardx-logo");
    if (!slider || !stage || !card) return;

    var N = SERVICES.length;
    function isMobile() { return window.innerWidth <= 860; }

    /* Construir diapositivas e insertarlas antes de la tarjeta */
    var slides = SERVICES.map(function (s, i) {
      var el = document.createElement("div");
      el.className = "svc-slide";
      el.style.zIndex = i + 1;
      el.innerHTML =
        '<div class="svc-panel svc-panel--media"><img src="' + s.img + '" alt="' + s.title + '" loading="' + (i === 0 ? "eager" : "lazy") + '"></div>' +
        '<div class="svc-panel svc-panel--copy" style="background:' + s.color + ';">' +
          '<p class="eyebrow">' + s.eyebrow + '</p>' +
          '<h1 class="svc-slide__title">' + s.title + '</h1>' +
          '<ul class="svc-slide__list">' + s.bullets.map(function (b) { return "<li>" + b + "</li>"; }).join("") + '</ul>' +
          '<a class="svc-slide__link" href="' + s.link + '">Ver servicio ' +
            '<svg width="13" height="13" viewBox="0 0 9 9" fill="none"><path d="M7 1H1M7 1V7M7 1L1 7" stroke="currentColor" stroke-width="1"/></svg></a>' +
        '</div>';
      stage.insertBefore(el, card);
      return el;
    });
    card.style.zIndex = N + 5;

    function drawCardLogo() { if (window.drawLogoIn) window.drawLogoIn(logo, 1.0, 0); }

    /* Móvil: apilado estático, sin slider fijo */
    if (isMobile()) {
      slider.style.height = "auto";
      card.style.display = "none";
      return;
    }

    slider.style.height = (N * 100) + "vh";

    slides.forEach(function (el, i) {
      if (i === 0) return;
      el.querySelector(".svc-panel--media").style.clipPath = "inset(100% 0 0 0)";
      el.querySelector(".svc-panel--copy").style.clipPath  = "inset(0 0 100% 0)";
    });
    card.style.backgroundColor = SERVICES[0].color;
    wipe.style.clipPath = "inset(100% 0 0 0)";
    var active = 0;
    drawCardLogo();

    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function update() {
      if (isMobile()) return;
      var rect = slider.getBoundingClientRect();
      var scrolled = -rect.top;

      if (scrolled <= 0) {
        slides.forEach(function (el, i) {
          el.querySelector(".svc-panel--media").style.clipPath = i === 0 ? "" : "inset(100% 0 0 0)";
          el.querySelector(".svc-panel--copy").style.clipPath  = i === 0 ? "" : "inset(0 0 100% 0)";
        });
        wipe.style.clipPath = "inset(100% 0 0 0)";
        card.style.backgroundColor = SERVICES[0].color;
        if (active !== 0) { active = 0; drawCardLogo(); }
        return;
      }

      var maxScroll = (N - 1) * window.innerHeight;
      var clamped = Math.min(scrolled, maxScroll);
      var raw = clamped / window.innerHeight;
      var fl = Math.floor(raw);
      var fromIdx, progress;
      if (fl >= N - 1) { fromIdx = N - 2; progress = 1; }
      else { fromIdx = fl; progress = ease(raw - fl); }

      slides.forEach(function (el, i) {
        var m = el.querySelector(".svc-panel--media");
        var c = el.querySelector(".svc-panel--copy");
        if (i <= fromIdx) { m.style.clipPath = ""; c.style.clipPath = ""; }
        else if (i === fromIdx + 1) {
          var pct = ((1 - progress) * 100).toFixed(2);
          m.style.clipPath = "inset(" + pct + "% 0 0 0)";
          c.style.clipPath = "inset(0 0 " + pct + "% 0)";
        } else { m.style.clipPath = "inset(100% 0 0 0)"; c.style.clipPath = "inset(0 0 100% 0)"; }
      });

      var nextIdx = Math.min(fromIdx + 1, N - 1);
      card.style.backgroundColor = SERVICES[fromIdx].color;
      if (nextIdx !== fromIdx && progress > 0) {
        wipe.style.backgroundColor = SERVICES[nextIdx].color;
        wipe.style.clipPath = "inset(" + ((1 - progress) * 100).toFixed(2) + "% 0 0 0)";
      } else {
        wipe.style.clipPath = "inset(100% 0 0 0)";
      }

      var target = progress > 0.5 ? nextIdx : fromIdx;
      if (target !== active) { active = target; drawCardLogo(); }
    }

    var raf = false;
    function onScroll() {
      if (!slider.isConnected) return;
      if (raf) return;
      raf = true;
      requestAnimationFrame(function () { raf = false; update(); });
    }
    if (window.__svcOnScroll) window.removeEventListener("scroll", window.__svcOnScroll);
    window.__svcOnScroll = onScroll;
    window.addEventListener("scroll", onScroll, { passive: true });
    update();
  })();
  </script>
</body>
</html>
